name: Basic Build & Test

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '10.0.x'

    - name: Check for C# dynamic
      run: ./.github/scripts/check-no-dynamic.ps1

    # No solution-wide restore: AJut.slnx holds the Android, iOS and macOS projects, whose workloads this runner doesn't
    #  have. The build and test scripts build one project at a time, and each restores just what that project needs.
    - name: Build AJut Libraries
      run: ./.github/scripts/build-targets.ps1
    
    - name: Test AJut Libraries
      run: ./.github/scripts/test-targets.ps1